name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting + the tytanic test suite. tytanic bundles its own Typst, so these
  # checks are independent of the system Typst version.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tt (tytanic) runs the test suite; typstyle checks formatting.
      - name: Install tytanic and typstyle
        run: cargo install --locked tytanic typstyle

      - name: Check formatting
        run: just format-check

      - name: Run tests
        run: just test

  # Compile every gallery demo AND every test file across the supported Typst
  # range, so feature/version regressions surface here. The `test` job above
  # cannot do this: tytanic embeds its own Typst, so it pins a single version
  # regardless of what is installed.
  #
  # Matrix: the floor (must match typst.toml `compiler`), the previous minor,
  # and whatever is current. Bump the middle entry when a new minor lands.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst-version: ["0.14.0", "0.14.2", "latest"]
    steps:
      - uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst-version }}

      - uses: extractions/setup-just@v4

      - name: Compile gallery and tests
        run: just compile-check

  # Dependency freshness: fails when a shipped dependency is behind the newest
  # release compatible with our Typst floor. typst-package-check flags these on
  # the release PR, so catching it here avoids a round-trip.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Check dependency freshness
        run: just check-deps
